<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient)"/>
  
  <!-- Building icon -->
  <g fill="white" stroke="none">
    <!-- Main building -->
    <rect x="25" y="30" width="20" height="35" rx="2"/>
    <!-- Side building -->
    <rect x="45" y="25" width="15" height="40" rx="2"/>
    <!-- Tall building -->
    <rect x="60" y="20" width="12" height="45" rx="2"/>
    
    <!-- Windows -->
    <rect x="28" y="35" width="3" height="3" fill="#0ea5e9"/>
    <rect x="34" y="35" width="3" height="3" fill="#0ea5e9"/>
    <rect x="40" y="35" width="3" height="3" fill="#0ea5e9"/>
    
    <rect x="28" y="42" width="3" height="3" fill="#0ea5e9"/>
    <rect x="34" y="42" width="3" height="3" fill="#0ea5e9"/>
    <rect x="40" y="42" width="3" height="3" fill="#0ea5e9"/>
    
    <rect x="28" y="49" width="3" height="3" fill="#0ea5e9"/>
    <rect x="34" y="49" width="3" height="3" fill="#0ea5e9"/>
    <rect x="40" y="49" width="3" height="3" fill="#0ea5e9"/>
    
    <rect x="28" y="56" width="3" height="3" fill="#0ea5e9"/>
    <rect x="34" y="56" width="3" height="3" fill="#0ea5e9"/>
    <rect x="40" y="56" width="3" height="3" fill="#0ea5e9"/>
    
    <!-- Side building windows -->
    <rect x="48" y="30" width="2.5" height="2.5" fill="#0ea5e9"/>
    <rect x="53.5" y="30" width="2.5" height="2.5" fill="#0ea5e9"/>
    
    <rect x="48" y="36" width="2.5" height="2.5" fill="#0ea5e9"/>
    <rect x="53.5" y="36" width="2.5" height="2.5" fill="#0ea5e9"/>
    
    <rect x="48" y="42" width="2.5" height="2.5" fill="#0ea5e9"/>
    <rect x="53.5" y="42" width="2.5" height="2.5" fill="#0ea5e9"/>
    
    <rect x="48" y="48" width="2.5" height="2.5" fill="#0ea5e9"/>
    <rect x="53.5" y="48" width="2.5" height="2.5" fill="#0ea5e9"/>
    
    <rect x="48" y="54" width="2.5" height="2.5" fill="#0ea5e9"/>
    <rect x="53.5" y="54" width="2.5" height="2.5" fill="#0ea5e9"/>
    
