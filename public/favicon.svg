    <rect x="63" y="25" width="2" height="2" fill="#0ea5e9"/>
    <rect x="67" y="25" width="2" height="2" fill="#0ea5e9"/>
    
    <rect x="63" y="30" width="2" height="2" fill="#0ea5e9"/>
    <rect x="67" y="30" width="2" height="2" fill="#0ea5e9"/>
    
    <rect x="63" y="35" width="2" height="2" fill="#0ea5e9"/>
    <rect x="67" y="35" width="2" height="2" fill="#0ea5e9"/>
    
    <rect x="63" y="40" width="2" height="2" fill="#0ea5e9"/>
    <rect x="67" y="40" width="2" height="2" fill="#0ea5e9"/>
    
    <rect x="63" y="45" width="2" height="2" fill="#0ea5e9"/>
    <rect x="67" y="45" width="2" height="2" fill="#0ea5e9"/>
    
    <rect x="63" y="50" width="2" height="2" fill="#0ea5e9"/>
    <rect x="67" y="50" width="2" height="2" fill="#0ea5e9"/>
    
    <rect x="63" y="55" width="2" height="2" fill="#0ea5e9"/>
    <rect x="67" y="55" width="2" height="2" fill="#0ea5e9"/>
    
    <rect x="63" y="60" width="2" height="2" fill="#0ea5e9"/>
    <rect x="67" y="60" width="2" height="2" fill="#0ea5e9"/>
